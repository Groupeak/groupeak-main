repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'cd backend-app && gofmt -w .'
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: bash -c 'cd backend-app && go vet ./...'
        language: system
        pass_filenames: false

      - id: go-unit-tests
        name: go test
        entry: bash -c 'cd backend-app && go test ./...'
        language: system
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd backend-app && go mod tidy'
        language: system
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd backend-app && golangci-lint run --fast'
        language: system
        pass_filenames: false

